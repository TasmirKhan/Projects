<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-container">
      <h1>Tic Tac Toe</h1>
      <div class="page-links"><a class="nav-link" href="leaderboard.html">Leaderboard</a><a class="nav-link" href="login.html">Switch Player</a></div>
      <p id="player-name" class="status"></p>

      <div class="controls">
        <label for="mode" class="control-label">Game mode</label>
        <select id="mode" class="mode-select" aria-label="Select game mode">
          <option value="pvp">Two players</option>
          <option value="ai">Single player vs AI</option>
        </select>
      </div>

      <p id="status" class="status" aria-live="polite">Current turn: X</p>

      <section class="board" aria-label="Tic Tac Toe board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </section>

      <button id="restart" class="restart-button" type="button">Restart Game</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
